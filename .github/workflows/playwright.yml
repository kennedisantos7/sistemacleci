name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cleci
          POSTGRES_PASSWORD: cleci
          POSTGRES_DB: cleci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Em CI não há PgBouncer: as duas apontam para a 5432 direta.
      DATABASE_URL: postgresql://cleci:cleci@localhost:5432/cleci?schema=public
      DIRECT_URL: postgresql://cleci:cleci@localhost:5432/cleci?schema=public
      AUTH_SECRET: ci-secret-nao-usado-em-producao
      NEXTAUTH_URL: http://localhost:3001
      SITE_URL: http://localhost:3000
      SISTEMA_URL: http://localhost:3001
      INGEST_API_KEY: ci-ingest-key
      BASE_URL: http://localhost:3001
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database
        run: |
          pnpm db:generate
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed:e2e

      - name: Install Playwright Chromium browser
        run: pnpm --filter @cleci/e2e exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter @cleci/e2e test

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
